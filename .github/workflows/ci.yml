name: CI

# GitHub Pages publishes this repo straight from main:/docs, so there is no
# deploy workflow - GitHub's own pages-build-deployment handles that on every
# push. This job is the gate on what goes in.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax, JSON, asset-path and translation checks
        run: node scripts/verify.mjs
